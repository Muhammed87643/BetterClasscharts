# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Android

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libmtdev1 zip unzip git openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
        python -m pip install --upgrade pip
        pip install poetry
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        git clone https://github.com/kivy/buildozer.git
        cd buildozer
        sudo python setup.py install
        cd ..
        poetry install --no-root
#        poetry run python3 src/main.py
    - name: Compile for Android
      run: |
        chmod +x ./build.sh
        ./build.sh
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: android-build
        path: ./
